<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Instagram Link Extractor</title>

<style>
body{
    font-family: Arial;
    padding:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
    gap:20px;
    margin-top:20px;
}

iframe{
    width:100%;
    height:480px;
    border:none;
}
</style>

</head>
<body>

<h2>Upload HTML File</h2>
<input type="file" id="fileInput">

<div id="grid"></div>

<script>

document.getElementById("fileInput").addEventListener("change", function(){

    const file = this.files[0];
    const reader = new FileReader();

    reader.onload = function(e){

        const html = e.target.result;

        const parser = new DOMParser();
        const doc = parser.parseFromString(html,"text/html");

        const links = [...doc.querySelectorAll("a")].map(a => a.href);

        const instaLinks = links.filter(link =>
            link.includes("instagram.com/p/") ||
            link.includes("instagram.com/reel/")
        );

        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        instaLinks.forEach(link => {

            const embed = link + "embed";

            const iframe = document.createElement("iframe");
            iframe.src = embed;

            grid.appendChild(iframe);

        });

    };

    reader.readAsText(file);

});

</script>

</body>
</html>
