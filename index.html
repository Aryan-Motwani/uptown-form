<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSD Gift Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #fffafb; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .carousel-container { display: flex; transition: transform 0.5s ease-in-out; }
        .category-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .hidden { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto shadow-2xl min-h-screen pb-24 relative bg-white">

    <header class="p-5 flex justify-between items-center bg-white sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center shadow-lg shadow-rose-200">
                <i class="fa-solid fa-gift text-white"></i>
            </div>
            <div>
                <p class="text-gray-800 font-bold text-lg leading-none">SSD Gift Collection</p>
                <p class="text-rose-400 text-xs font-medium">Premium Gifting Experience</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button class="bg-rose-50 p-2 rounded-full text-rose-500"><i class="fa-regular fa-bell"></i></button>
        </div>
    </header>

    <div class="px-5 mt-2">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search toys, board games..." 
                   class="w-full bg-gray-50 border-none rounded-2xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-rose-200 outline-none text-sm shadow-sm">
        </div>
    </div>

    <div class="px-5 mt-6 overflow-hidden relative group">
        <div id="carousel" class="carousel-container w-full">
            <div class="min-w-full">
                <div class="bg-rose-600 rounded-3xl h-44 relative overflow-hidden flex items-center p-6 text-white">
                    <div class="z-10 w-2/3">
                        <p class="text-xs font-bold uppercase tracking-widest mb-1 opacity-80">Summer Sale</p>
                        <h2 class="text-2xl font-bold leading-tight">Up to 40% Off on Toys</h2>
                        <button class="mt-3 bg-white text-rose-600 px-4 py-2 rounded-xl font-bold text-xs">Shop Now</button>
                    </div>
                    <img src="https://images.unsplash.com/photo-1566576721346-d4a3b4eaeb55?q=80&w=500&auto=format&fit=crop" class="absolute right-0 top-0 w-1/2 h-full object-cover opacity-60" alt="Toys">
                </div>
            </div>
            <div class="min-w-full">
                <div class="bg-indigo-600 rounded-3xl h-44 relative overflow-hidden flex items-center p-6 text-white">
                    <div class="z-10 w-2/3">
                        <p class="text-xs font-bold uppercase tracking-widest mb-1 opacity-80">Modern Tech</p>
                        <h2 class="text-2xl font-bold leading-tight">Latest Gift Electronics</h2>
                        <button class="mt-3 bg-white text-indigo-600 px-4 py-2 rounded-xl font-bold text-xs">Explore</button>
                    </div>
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=500&auto=format&fit=crop" class="absolute right-0 top-0 w-1/2 h-full object-cover opacity-60" alt="Electronics">
                </div>
            </div>
        </div>
        <div class="flex justify-center gap-2 mt-3">
            <div onclick="moveCarousel(0)" class="dot w-6 h-2 bg-rose-500 rounded-full cursor-pointer"></div>
            <div onclick="moveCarousel(1)" class="dot w-2 h-2 bg-gray-200 rounded-full cursor-pointer"></div>
        </div>
    </div>

    <div id="mainContent">
        <div id="categoryView" class="px-5 mt-8 pb-8">
            <h3 class="font-bold text-lg text-gray-800 mb-4">Shop Categories</h3>
            <div class="grid grid-cols-2 gap-4">
                <div onclick="showProducts('Toys')" class="category-card bg-orange-50 p-4 rounded-3xl border border-orange-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Toys">
                    <p class="font-bold text-center text-gray-700">Toys</p>
                </div>
                <div onclick="showProducts('Stationery')" class="category-card bg-blue-50 p-4 rounded-3xl border border-blue-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Stationery">
                    <p class="font-bold text-center text-gray-700">Stationery</p>
                </div>
                <div onclick="showProducts('Board Games')" class="category-card bg-purple-50 p-4 rounded-3xl border border-purple-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1610890732551-213067c7d977?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Games">
                    <p class="font-bold text-center text-gray-700">Board Games</p>
                </div>
                <div onclick="showProducts('Ride-on Cars')" class="category-card bg-red-50 p-4 rounded-3xl border border-red-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1531983412531-1f49a365ffed?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Cars">
                    <p class="font-bold text-center text-gray-700">Ride-on Cars</p>
                </div>
                <div onclick="showProducts('Electronics')" class="category-card bg-cyan-50 p-4 rounded-3xl border border-cyan-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1491933382434-500287f9b54b?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Tech">
                    <p class="font-bold text-center text-gray-700">Electronics</p>
                </div>
                <div onclick="showProducts('Decor')" class="category-card bg-emerald-50 p-4 rounded-3xl border border-emerald-100 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1534349762230-e0caa9c47ad0?w=200&auto=format&fit=crop" class="w-full h-24 object-cover rounded-2xl mb-3 shadow-md" alt="Decor">
                    <p class="font-bold text-center text-gray-700">Decor</p>
                </div>
            </div>
        </div>

        <div id="productView" class="px-5 mt-6 hidden pb-8">
            <div class="flex items-center gap-3 mb-6">
                <button onclick="showCategories()" class="w-10 h-10 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h3 id="categoryTitle" class="font-bold text-xl text-gray-800">Products</h3>
            </div>
            <div id="productGrid" class="grid grid-cols-2 gap-4">
                </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-80 bg-white/90 backdrop-blur-lg shadow-2xl rounded-full px-4 py-2 flex justify-between items-center border border-rose-50 z-50">
        <button onclick="showCategories()" class="bg-rose-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-rose-200">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="text-gray-400 w-12 h-12"><i class="fa-solid fa-heart"></i></button>
        <button class="text-gray-400 w-12 h-12"><i class="fa-solid fa-cart-shopping"></i></button>
        <button class="text-gray-400 w-12 h-12"><i class="fa-solid fa-user"></i></button>
    </div>

    <script>
        // Data Structure
        const inventory = {
            'Toys': [
                { name: 'Teddy Bear', price: 999, img: 'https://images.unsplash.com/photo-1559440666-3f045da1c2e2?w=300&auto=format&fit=crop' },
                { name: 'Lego Set', price: 2499, img: 'https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?w=300&auto=format&fit=crop' }
            ],
            'Stationery': [
                { name: 'Leather Journal', price: 750, img: 'https://images.unsplash.com/photo-1544816155-12df9643f363?w=300&auto=format&fit=crop' },
                { name: 'Parker Pen', price: 1200, img: 'https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=300&auto=format&fit=crop' }
            ],
            'Board Games': [
                { name: 'Chess Set', price: 1500, img: 'https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=300&auto=format&fit=crop' },
                { name: 'Monopoly', price: 1199, img: 'https://images.unsplash.com/photo-1611891487122-207579d67d98?w=300&auto=format&fit=crop' }
            ],
            'Ride-on Cars': [
                { name: 'Electric Jeep', price: 15999, img: 'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=300&auto=format&fit=crop' },
                { name: 'Pedal Kart', price: 5499, img: 'https://images.unsplash.com/photo-1531983412531-1f49a365ffed?w=300&auto=format&fit=crop' }
            ],
            'Electronics': [
                { name: 'BT Speaker', price: 2999, img: 'https://images.unsplash.com/photo-1608156639585-b3a032ef9689?w=300&auto=format&fit=crop' },
                { name: 'Instax Mini', price: 5999, img: 'https://images.unsplash.com/photo-1526170315873-3a92b4880d4d?w=300&auto=format&fit=crop' }
            ],
            'Decor': [
                { name: 'Glass Vase', price: 899, img: 'https://images.unsplash.com/photo-1581783898377-1c85bf937427?w=300&auto=format&fit=crop' },
                { name: 'Neon Sign', price: 2100, img: 'https://images.unsplash.com/photo-1563245372-f21724e3856d?w=300&auto=format&fit=crop' }
            ]
        };

        // Carousel Logic
        let currentSlide = 0;
        function moveCarousel(slideIndex) {
            const carousel = document.getElementById('carousel');
            const dots = document.querySelectorAll('.dot');
            currentSlide = slideIndex;
            carousel.style.transform = `translateX(-${slideIndex * 100}%)`;
            dots.forEach((dot, i) => {
                dot.className = i === slideIndex ? 'dot w-6 h-2 bg-rose-500 rounded-full cursor-pointer' : 'dot w-2 h-2 bg-gray-200 rounded-full cursor-pointer';
            });
        }
        setInterval(() => moveCarousel(currentSlide === 0 ? 1 : 0), 4000);

        // Navigation Logic
        function showProducts(category) {
            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('productView').classList.remove('hidden');
            document.getElementById('categoryTitle').innerText = category;
            
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            inventory[category].forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white border border-gray-100 rounded-3xl p-3 shadow-sm product-card">
                        <img src="${item.img}" class="w-full h-32 object-cover rounded-2xl mb-3" alt="${item.name}">
                        <p class="font-bold text-gray-800 text-sm truncate">${item.name}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-rose-600 font-bold text-sm">₹${item.price}</span>
                            <button class="w-8 h-8 bg-rose-500 rounded-full text-white text-xs shadow-md"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                `;
            });
            window.scrollTo(0,0);
        }

        function showCategories() {
            document.getElementById('productView').classList.add('hidden');
            document.getElementById('categoryView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // Search Logic
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.category-card');
            
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
