ancd<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Instagram Thumbnail Extractor</title>

<style>
body{
font-family:Arial;
padding:20px;
background:#fafafa;
}

#grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:16px;
margin-top:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.card img{
width:100%;
display:block;
}

.card a{
display:block;
text-align:center;
padding:8px;
text-decoration:none;
background:#E1306C;
color:white;
font-size:14px;
}

#loadMore{
margin-top:20px;
padding:10px 20px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Upload HTML File</h2>
<input type="file" id="fileInput">

<div id="grid"></div>

<button id="loadMore" style="display:none;">Load More</button>

<script>

let instaLinks=[];
let index=0;
const batchSize=10;

async function getThumbnail(url){

try{

const res=await fetch(
"https://api.allorigins.win/raw?url="+
encodeURIComponent(
`https://www.instagram.com/oembed/?url=${url}`
)
);

const data=await res.json();
return data.thumbnail_url;

}catch{
return null;
}

}

async function renderPosts(){

const grid=document.getElementById("grid");

const items=instaLinks.slice(index,index+batchSize);

for(const link of items){

const thumb=await getThumbnail(link);

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="${thumb || ""}">
<a href="${link}" target="_blank">Open Post</a>
`;

grid.appendChild(card);

}

index+=batchSize;

if(index>=instaLinks.length){
document.getElementById("loadMore").style.display="none";
}

}

document.getElementById("fileInput").addEventListener("change",function(){

const file=this.files[0];
const reader=new FileReader();

reader.onload=function(e){

const parser=new DOMParser();
const doc=parser.parseFromString(e.target.result,"text/html");

const links=[...doc.querySelectorAll("a")].map(a=>a.href);

instaLinks=links.filter(link=>
link.includes("instagram.com/p/")||
link.includes("instagram.com/reel/")
);

index=0;
document.getElementById("grid").innerHTML="";

renderPosts();

if(instaLinks.length>batchSize){
document.getElementById("loadMore").style.display="block";
}

};

reader.readAsText(file);

});

document.getElementById("loadMore").addEventListener("click",renderPosts);

</script>

</body>
</html>
