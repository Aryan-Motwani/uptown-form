<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Instagram Link Extractor</title>

<style>
body{
    font-family: Arial;
    padding:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    border-radius:10px;
    overflow:hidden;
    background:#f4f4f4;
}

.card img{
    width:100%;
    display:block;
}

.card a{
    text-decoration:none;
    color:black;
    font-size:12px;
    padding:6px;
    display:block;
}

#loadMore{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<h2>Upload HTML File</h2>
<input type="file" id="fileInput">

<div id="grid"></div>

<button id="loadMore" style="display:none;">Load More</button>

<script>

let instaLinks = [];
let index = 0;
const batchSize = 10;

function extractPostId(url){

    let parts = url.split("/");
    return parts[4]; // works for /p/ and /reel/

}

function renderPosts(){

    const grid = document.getElementById("grid");

    const nextItems = instaLinks.slice(index, index + batchSize);

    nextItems.forEach(link => {

        const postId = extractPostId(link);

        const thumb = `https://www.instagram.com/p/${postId}/media/?size=l`;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <a href="${link}" target="_blank">
                <img src="${thumb}" loading="lazy">
                Open Post
            </a>
        `;

        grid.appendChild(card);

    });

    index += batchSize;

    if(index >= instaLinks.length){
        document.getElementById("loadMore").style.display = "none";
    }

}

document.getElementById("fileInput").addEventListener("change", function(){

    const file = this.files[0];
    const reader = new FileReader();

    reader.onload = function(e){

        const parser = new DOMParser();
        const doc = parser.parseFromString(e.target.result,"text/html");

        const links = [...doc.querySelectorAll("a")].map(a => a.href);

        instaLinks = links.filter(link =>
            link.includes("instagram.com/p/") ||
            link.includes("instagram.com/reel/")
        );

        index = 0;
        document.getElementById("grid").innerHTML = "";

        renderPosts();

        if(instaLinks.length > batchSize){
            document.getElementById("loadMore").style.display = "block";
        }

    };

    reader.readAsText(file);

});

document.getElementById("loadMore").addEventListener("click", renderPosts);

</script>

</body>
</html>
