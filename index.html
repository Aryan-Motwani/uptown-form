<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifty - Premium Gift Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #fffafb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .category-card:active { transform: scale(0.95); transition: 0.2s; }
        .hidden { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto shadow-2xl min-h-screen pb-24 relative bg-white">

    <header class="p-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center border-2 border-rose-200">
                <i class="fa-solid fa-gift text-rose-500 text-xl"></i>
            </div>
            <div>
                <p class="text-gray-800 font-bold text-sm">Find a Gift, Alex ✨</p>
                <p class="text-gray-400 text-xs">Special occasions today</p>
            </div>
        </div>
        <div class="bg-white p-2 rounded-full border border-rose-50 shadow-sm relative">
            <i class="fa-regular fa-bell text-xl text-rose-400"></i>
        </div>
    </header>

    <div class="px-5 flex gap-3">
        <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-rose-300"></i>
            <input type="text" placeholder="Search for birthday, decor..." class="w-full bg-rose-50/50 border-none rounded-2xl py-3 pl-12 focus:ring-1 focus:ring-rose-300 outline-none text-sm">
        </div>
    </div>

    <div class="px-5 mt-6">
        <div class="bg-gradient-to-br from-rose-400 to-rose-600 rounded-3xl p-6 text-white relative overflow-hidden shadow-lg">
            <p class="text-xs uppercase tracking-widest opacity-90 font-bold">New Arrival</p>
            <h2 class="text-2xl font-bold mt-1 leading-tight">Handcrafted<br>Gift Boxes</h2>
            <button class="mt-4 bg-white text-rose-600 px-5 py-2 rounded-xl font-bold text-xs shadow-md">Browse Collection</button>
            <i class="fa-solid fa-wand-magic-sparkles absolute -right-4 -bottom-2 text-8xl text-white/10 rotate-12"></i>
        </div>
    </div>

    <div id="categoryView" class="px-5 mt-8">
        <h3 class="font-bold text-lg text-gray-800 mb-4">Shop by Category</h3>
        <div class="grid grid-cols-2 gap-4">
            <div onclick="showProducts('Birthday')" class="category-card bg-rose-50 rounded-3xl p-5 text-center cursor-pointer border border-rose-100">
                <div class="text-3xl mb-2">🎂</div>
                <p class="font-bold text-gray-700">Birthday</p>
                <p class="text-[10px] text-rose-400 uppercase font-bold">120 Items</p>
            </div>
            <div onclick="showProducts('Jewelry')" class="category-card bg-amber-50 rounded-3xl p-5 text-center cursor-pointer border border-amber-100">
                <div class="text-3xl mb-2">💎</div>
                <p class="font-bold text-gray-700">Jewelry</p>
                <p class="text-[10px] text-amber-500 uppercase font-bold">85 Items</p>
            </div>
            <div onclick="showProducts('Flowers')" class="category-card bg-green-50 rounded-3xl p-5 text-center cursor-pointer border border-green-100">
                <div class="text-3xl mb-2">💐</div>
                <p class="font-bold text-gray-700">Flowers</p>
                <p class="text-[10px] text-green-500 uppercase font-bold">40 Items</p>
            </div>
            <div onclick="showProducts('Custom')" class="category-card bg-blue-50 rounded-3xl p-5 text-center cursor-pointer border border-blue-100">
                <div class="text-3xl mb-2">🎨</div>
                <p class="font-bold text-gray-700">Customized</p>
                <p class="text-[10px] text-blue-400 uppercase font-bold">200 Items</p>
            </div>
        </div>
    </div>

    <div id="productView" class="px-5 mt-8 hidden">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="showCategories()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <h3 id="categoryTitle" class="font-bold text-lg text-gray-800">Category Name</h3>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white border border-gray-100 rounded-3xl p-4 shadow-sm">
                <div class="h-32 bg-rose-50 rounded-2xl flex items-center justify-center text-4xl mb-3">🎁</div>
                <p class="font-bold text-gray-800 text-sm">Premium Box</p>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-rose-500 font-bold">$45.00</span>
                    <button class="w-8 h-8 bg-rose-500 rounded-full text-white text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            <div class="bg-white border border-gray-100 rounded-3xl p-4 shadow-sm">
                <div class="h-32 bg-amber-50 rounded-2xl flex items-center justify-center text-4xl mb-3">🕯️</div>
                <p class="font-bold text-gray-800 text-sm">Scented Candle</p>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-rose-500 font-bold">$12.99</span>
                    <button class="w-8 h-8 bg-rose-500 rounded-full text-white text-xs"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-80 bg-white/90 backdrop-blur-md shadow-2xl rounded-full px-4 py-2 flex justify-between items-center border border-rose-50">
        <button onclick="showCategories()" class="bg-rose-500 text-white px-6 py-2.5 rounded-full flex items-center gap-2 font-bold text-sm">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="text-gray-400 p-2"><i class="fa-solid fa-heart text-xl"></i></button>
        <button class="text-gray-400 p-2"><i class="fa-solid fa-cart-shopping text-xl"></i></button>
        <button class="text-gray-400 p-2"><i class="fa-solid fa-user text-xl"></i></button>
    </div>

    <script>
        function showProducts(name) {
            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('productView').classList.remove('hidden');
            document.getElementById('categoryTitle').innerText = name + " Gifts";
            window.scrollTo(0, 0);
        }

        function showCategories() {
            document.getElementById('productView').classList.add('hidden');
            document.getElementById('categoryView').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
